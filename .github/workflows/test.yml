name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # push 契機だけだと、コードを変更しない期間の劣化に気づけない。
  #   - 実時刻に依存するテストの「時限爆弾」化（絶対日付のハードコード等）
  #   - 依存パッケージの破壊的更新（requirements.txt はバージョン範囲を許す箇所がある）
  #   - 外部API・データソース側の仕様変更
  # 実際、2026-06〜08 の約2か月間テストが壊れたままだったのを、次の push まで検知できなかった。
  # 毎週月曜 00:00 UTC = 月曜 09:00 JST（週明けに結果を確認できる時刻）に実行する。
  # 注意: GitHub はリポジトリが60日間無活動だと schedule を自動で停止する。
  #       長期間 push しない場合は Actions タブで有効化し直すこと（下の workflow_dispatch で手動実行も可）。
  schedule:
    - cron: "0 0 * * 1"
  # 手動実行（Actions タブの "Run workflow"）。原因調査・再実行に使う。
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 本番ターゲットは Windows（kabuステーションがWindows専用）。
        # Linux でも基本動作を担保するため両方で実行する。
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # Windowsでも bash（grep/パイプ）を使えるようにする
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # pandas-ta==0.3.14b0 は PyPI で Python 3.11 向けに未配布のため除外する。
        # テスト環境では conftest.py がスタブを注入するため不要。
        # Windows ネイティブの pip.exe は /dev/stdin を解釈できないため、
        # 実ファイルに書き出してから -r で渡す（OS非依存にする）。
        run: |
          grep -v '^pandas-ta' requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short
